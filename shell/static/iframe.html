<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Rancher iframe test</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }

      body {
        background: #f4f5f7;
      }

      iframe {
        width: 100%;
        height: 100%;
        border: 0;
        display: block;
      }
    </style>
  </head>
  <body>
    <iframe
      src="/dashboard/"
      title="Rancher Dashboard"
      allow="clipboard-read; clipboard-write"
    ></iframe>
  </body>
</html>
